[project]
name = "zipsolve"
version = "0.1.0"
description = "Zip puzzles (LinkedIn-style) on arbitrary graphs: 2D, walls, islands, 3D, 4D, with RL agents"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "networkx", "matplotlib", "gymnasium", "torch", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
screenshots = ["playwright"]
robots = ["python-sat"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zipsolve*"]

[tool.setuptools.package-data]
"zipsolve" = ["architect_surrogate.npz"]
"zipsolve.app" = ["static/*", "static/play/*", "static/bank/*.json", "static/bank/*.md", "static/bank/pools/*",
                  "static/bank/daily/*", "static/bank/robots/*", "static/bank/architect/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
