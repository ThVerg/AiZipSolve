name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          for f in $(git ls-files 'zipsolve/app/static/*.js' 'zipsolve/app/static/**/*.js'); do
            node --check "$f" || exit 1
          done

      - name: Build the static site
        run: |
          if [ -f zipsolve/app/static/bank/index.json ]; then python scripts/build_site.py --out dist; else echo "no puzzle bank yet: skipped"; fi
